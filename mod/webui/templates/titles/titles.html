<div class="titles">

  <!-- ──── 颜色 / 分类:胶囊可同时按两者筛选下方头衔库与玩家,按钮新增 / 编辑;头衔库默认折叠 ──── -->
  <section class="dash-section">
    <div class="dash-section-header">
      <h2 class="dash-section-title"><svg class="ui-icon title-icon"><use href="#i-title"/></svg><span>头衔系统</span></h2>
      <div class="dash-section-meta">
        <span class="dash-meta-label">数据目录</span>
        <span id="titles-path" class="dash-meta-value dash-mono">—</span>
      </div>
    </div>

    <div id="titles-color-bar" class="titles-level-bar">
      <span class="titles-bar-label">颜色</span>
      <div id="titles-color-chips" class="titles-level-chips"></div>
      <div class="titles-level-actions">
        <button id="titles-color-add" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-plus"/></svg><span class="btn-label">新增颜色</span></button>
        <button id="titles-color-edit" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-edit"/></svg><span class="btn-label">编辑颜色</span></button>
      </div>
    </div>
    <div id="titles-color-editor" class="titles-level-editor" hidden></div>

    <div id="titles-category-bar" class="titles-level-bar">
      <span class="titles-bar-label">分类</span>
      <div id="titles-category-chips" class="titles-level-chips"></div>
      <div class="titles-level-actions">
        <button id="titles-category-add" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-plus"/></svg><span class="btn-label">新增分类</span></button>
        <button id="titles-category-edit" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-edit"/></svg><span class="btn-label">编辑分类</span></button>
      </div>
    </div>
    <div id="titles-category-editor" class="titles-level-editor" hidden></div>

    <div class="titles-lib">
      <div class="titles-lib-head">
        <button id="titles-lib-toggle" class="titles-lib-toggle" type="button" aria-expanded="false">
          <svg class="ui-icon titles-lib-caret"><use href="#i-arrow-down"/></svg><span class="btn-label">头衔库</span><span id="titles-lib-count" class="titles-lib-count">0</span>
        </button>
        <div id="titles-lib-actions" class="titles-level-actions">
          <button id="titles-lib-add" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-plus"/></svg><span class="btn-label">新增头衔</span></button>
          <button id="titles-lib-edit" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-edit"/></svg><span class="btn-label">编辑头衔库</span></button>
        </div>
        <!-- 编辑中:顶部也放一组取消 / 保存 -->
        <div id="titles-lib-top-actions" class="titles-level-actions" hidden>
          <span class="titles-edit-msg"></span>
          <button class="dash-btn dash-btn-small" type="button" data-act="lib-cancel"><svg class="ui-icon btn-icon"><use href="#i-x"/></svg><span class="btn-label">取消</span></button>
          <button class="dash-btn dash-btn-small dash-btn-primary" type="button" data-act="lib-save"><svg class="ui-icon btn-icon"><use href="#i-save"/></svg><span class="btn-label">保存</span></button>
        </div>
      </div>
      <div id="titles-lib-body" class="titles-lib-body" hidden></div>
      <div id="titles-lib-editor" class="titles-level-editor" hidden></div>
    </div>
  </section>

  <!-- ──── 玩家头衔 ──── -->
  <section class="dash-section">
    <div class="dash-section-header">
      <h2 class="dash-section-title"><svg class="ui-icon title-icon"><use href="#i-users"/></svg><span>玩家头衔</span></h2>
      <div class="dash-section-meta">
        <span class="dash-meta-label">共</span>
        <span id="titles-count" class="dash-meta-value">—</span>
        <span class="dash-meta-label">玩家</span>
        <button id="titles-refresh" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-refresh"/></svg><span class="btn-label">刷新</span></button>
      </div>
    </div>

    <div class="titles-toolbar">
      <span class="titles-search-wrap"><svg class="ui-icon btn-icon"><use href="#i-search"/></svg><input type="text" id="titles-search" placeholder="搜索 昵称 / OpenID / 头衔" autocomplete="off" spellcheck="false"></span>
      <span class="titles-add-wrap">
        <input type="text" id="titles-add-openid" placeholder="输入昵称或 OpenID 添加玩家" autocomplete="off" spellcheck="false">
        <button id="titles-add" class="dash-btn dash-btn-small dash-btn-primary"><svg class="ui-icon btn-icon"><use href="#i-plus"/></svg><span class="btn-label">添加玩家</span></button>
        <button id="titles-grant-open" class="dash-btn dash-btn-small"><svg class="ui-icon btn-icon"><use href="#i-users"/></svg><span class="btn-label">批量授予</span></button>
        <div id="titles-add-results" class="titles-add-results" hidden></div>
      </span>
      <span id="titles-msg" class="titles-msg"></span>
    </div>

    <div id="titles-list" class="titles-list"></div>

    <p class="titles-note">
      头衔名最多 <span id="titles-name-max">—</span> 个字。「限定」头衔不进头衔库，只在玩家的头衔列表里出现（虚线框）。
    </p>
  </section>

  <!-- 点玩家昵称时浮在光标上方，显示 OpenID -->
  <div id="titles-pop" class="titles-pop" hidden></div>

  <!-- 玩家编辑弹窗:内容由 titles.js 渲染 -->
  <div id="titles-modal-backdrop" class="titles-modal-backdrop" hidden>
    <div id="titles-modal" class="titles-modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- 批量授予弹窗:内容由 titles.js 渲染 -->
  <div id="titles-grant-backdrop" class="titles-modal-backdrop" hidden>
    <div id="titles-grant" class="titles-modal titles-grant" role="dialog" aria-modal="true"></div>
  </div>

</div>
