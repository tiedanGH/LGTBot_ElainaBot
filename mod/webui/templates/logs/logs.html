<div class="filters">
  <button class="active" data-f="all">全部</button>
  <button data-f="in"><svg class="ui-icon btn-icon"><use href="#i-arrow-down"/></svg><span class="btn-label">收到</span></button>
  <button data-f="out"><svg class="ui-icon btn-icon"><use href="#i-arrow-up"/></svg><span class="btn-label">发出</span></button>
  <button data-f="group">群聊</button>
  <button data-f="private">私聊</button>
  <span class="spacer"></span>
  <span class="stats" id="logs-stats">—</span>
  <button id="auto-toggle" title="暂停/恢复自动刷新"><svg class="ui-icon btn-icon"><use href="#i-pause"/></svg><span class="btn-label">自动</span></button>
</div>
<div class="log-list" id="log-list"></div>
