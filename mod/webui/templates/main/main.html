<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>LGTBot 机器人</title>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('lgtbot-page-theme') || 'auto';
        var dark = (m === 'dark') ||
                   (m !== 'light' && localStorage.getItem('elaina_dark') === '1');
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style>
__MAIN_CSS__

/* ───── 各 tab 专属样式(每个 page_*.py 的 TAB_CSS) ───── */
__DASHBOARD_CSS__

__METRICS_CSS__

__CONFIG_CSS__

__BUILD_CSS__

__LOGS_CSS__

__USERS_CSS__

__BACKUP_CSS__

__AUDIT_CSS__

__REVIEW_CSS__

__CRASH_CSS__

__PREBUILT_CSS__
  </style>
</head>
<body>
__ICON_SPRITE__

  <div class="sticky-top">
    <div class="topbar">
      <h1><img class="topbar-logo" src="__LOGO_DATA_URI__" alt="">LGTBot 机器人</h1>
      <div class="topbar-actions">
        <button id="fullscreen-btn" class="icon-btn" title="新窗口全屏打开"><svg class="ui-icon"><use href="#i-fullscreen"/></svg></button>
        <button id="theme-toggle" class="icon-btn" title="主题：自动（跟随主面板）"><svg class="ui-icon"><use href="#i-theme-auto"/></svg></button>
        <button id="planned-restart-btn" class="restart-btn planned-btn" title="切换维护模式：暂停创建新游戏"><svg class="ui-icon"><use href="#i-maintenance"/></svg><span id="planned-restart-label">计划重启</span></button>
        <button id="restart-btn" class="restart-btn" title="重启 LGTBot 引擎 (整进程重载 C++)"><svg class="ui-icon"><use href="#i-restart"/></svg><span>重启 LGTBot</span></button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="dashboard"><svg class="ui-icon tab-icon"><use href="#i-dashboard"/></svg>仪表盘<span class="tab-clean-badge" id="dash-clean-badge">清理</span></button>
      <button class="tab" data-tab="metrics"><svg class="ui-icon tab-icon"><use href="#i-metrics"/></svg>指标面板</button>
      <button class="tab" data-tab="config"><svg class="ui-icon tab-icon"><use href="#i-config"/></svg>配置管理</button>
      <button class="tab" data-tab="prebuilt"><svg class="ui-icon tab-icon"><use href="#i-prebuilt"/></svg>预编译部署</button>
      <button class="tab" data-tab="build"><svg class="ui-icon tab-icon"><use href="#i-build"/></svg>引擎编译</button>
      <button class="tab" data-tab="backup"><svg class="ui-icon tab-icon"><use href="#i-backup"/></svg>数据备份</button>
      <button class="tab" data-tab="logs"><svg class="ui-icon tab-icon"><use href="#i-logs"/></svg>消息日志<span class="tab-live-badge" id="live-badge">实时</span></button>
      <button class="tab" data-tab="crash"><svg class="ui-icon tab-icon"><use href="#i-crash"/></svg>崩溃转储<span class="tab-clean-badge" id="crash-clean-badge">清理</span></button>
      <button class="tab" data-tab="review"><svg class="ui-icon tab-icon"><use href="#i-review"/></svg>昵称审核<span class="tab-alert-badge" id="review-pending-badge"></span></button>
      <button class="tab" data-tab="audit"><svg class="ui-icon tab-icon"><use href="#i-audit"/></svg>操作审计</button>
      <button class="tab" data-tab="users"><svg class="ui-icon tab-icon"><use href="#i-users"/></svg>用户数据</button>
    </div>
  </div>

  <div class="page-content">
    <div id="tab-dashboard" class="tab-pane active">
__DASHBOARD_HTML__
    </div>

    <div id="tab-metrics" class="tab-pane">
__METRICS_HTML__
    </div>

    <div id="tab-config" class="tab-pane">
__CONFIG_HTML__
    </div>

    <div id="tab-prebuilt" class="tab-pane">
__PREBUILT_HTML__
    </div>

    <div id="tab-build" class="tab-pane">
__BUILD_HTML__
    </div>

    <div id="tab-backup" class="tab-pane">
__BACKUP_HTML__
    </div>

    <div id="tab-logs" class="tab-pane">
__LOGS_HTML__
    </div>

    <div id="tab-audit" class="tab-pane">
__AUDIT_HTML__
    </div>

    <div id="tab-crash" class="tab-pane">
__CRASH_HTML__
    </div>

    <div id="tab-review" class="tab-pane">
__REVIEW_HTML__
    </div>

    <div id="tab-users" class="tab-pane">
__USERS_HTML__
    </div>
  </div>

  <!-- 全局自定义弹窗(替代浏览器 confirm/alert/prompt)—— 各 tab 共用 ——
       通过 main.js 的 dashConfirm/dashAlert/dashPrompt 异步函数控制显示 -->
  <div id="dash-modal-backdrop" class="dash-modal-backdrop hidden" aria-hidden="true">
    <div id="dash-modal" class="dash-modal level-info" role="dialog" aria-modal="true">
      <div class="dash-modal-body">
        <div id="dash-modal-message" class="dash-modal-message"></div>
        <input id="dash-modal-input" class="dash-modal-input" type="text"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               style="display:none">
        <label id="dash-modal-checkbox-row" class="dash-modal-checkbox" style="display:none">
          <input id="dash-modal-checkbox" type="checkbox">
          <span id="dash-modal-checkbox-label"></span>
        </label>
      </div>
      <div class="dash-modal-actions">
        <button id="dash-modal-cancel" class="dash-btn" type="button">取消</button>
        <button id="dash-modal-ok" class="dash-btn dash-btn-primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <script id="dashboard-data" type="application/json">__DASHBOARD_DATA__</script>
  <script id="metrics-data" type="application/json">__METRICS_DATA__</script>
  <script id="config-data" type="application/json">__CONFIG_DATA__</script>
  <script id="build-data" type="application/json">__BUILD_DATA__</script>
  <script id="log-data" type="application/json">__LOG_DATA__</script>
  <script id="user-data" type="application/json">__USER_DATA__</script>
  <script id="backup-data" type="application/json">__BACKUP_DATA__</script>
  <script id="audit-data" type="application/json">__AUDIT_DATA__</script>
  <script id="review-data" type="application/json">__REVIEW_DATA__</script>
  <script id="crash-data" type="application/json">__CRASH_DATA__</script>
  <script id="prebuilt-data" type="application/json">__PREBUILT_DATA__</script>
  <script>
__MAIN_JS__

__DASHBOARD_JS__

__METRICS_JS__

__CONFIG_JS__

__BUILD_JS__

__LOGS_JS__

__USERS_JS__

__BACKUP_JS__

__AUDIT_JS__

__REVIEW_JS__

__CRASH_JS__

__PREBUILT_JS__
  </script>
</body>
</html>
