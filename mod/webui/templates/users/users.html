<div class="users-toolbar">
  <span class="query-time-wrap">查询时间：<span id="users-query-time">—</span></span>
  <span class="users-total-wrap">总用户：<span id="users-total">—</span></span>
  <span class="spacer"></span>
  <span class="users-search-wrap"><svg class="ui-icon btn-icon"><use href="#i-search"/></svg><input type="text" id="users-search" placeholder="搜索 昵称 或 OpenID" autocomplete="off" spellcheck="false"></span>
  <span class="spacer"></span>
  <div class="pagination">
    <button id="users-prev" title="上一页">‹</button>
    <input type="number" id="users-page-input" min="1" value="1" title="输入页码跳转">
    <span class="page-total">/ <span id="users-page-total">1</span></span>
    <button id="users-next" title="下一页">›</button>
  </div>
  <button id="users-refresh" title="重新查询主框架用户数据库"><svg class="ui-icon btn-icon"><use href="#i-refresh"/></svg><span class="btn-label">刷新数据</span></button>
</div>

<div class="users-grid">
  <div class="users-section">
    <div class="users-header">
      <div class="header-row">
        <div class="col-idx">序号</div>
        <div class="col-user">用户</div>
        <div class="col-openid">OpenID</div>
        <div class="col-msgs">消息数</div>
        <div class="col-seen">最后活跃</div>
      </div>
    </div>
    <div id="users-list-1"></div>
  </div>
  <div class="users-section users-section-right">
    <div class="users-header">
      <div class="header-row">
        <div class="col-idx">序号</div>
        <div class="col-user">用户</div>
        <div class="col-openid">OpenID</div>
        <div class="col-msgs">消息数</div>
        <div class="col-seen">最后活跃</div>
      </div>
    </div>
    <div id="users-list-2"></div>
  </div>
</div>

<p class="users-note">
  数据来自主框架数据库：昵称 / 消息数 / 活跃日期由框架按事件记录。消息数为终身累计（每日凌晨聚合，<b>统计截至昨日</b>），口径是<b>与机器人的交互</b>——私信与 @机器人 的群消息都计入，<b>全量群里没有 @机器人 的消息不计</b>。首屏仅加载前 1000 条
</p>
