name: Update LGTBot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  update-lgtbot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Git setup
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update lgtbot submodule
        run: |
          branch=$(git config -f .gitmodules submodule.lgtbot.branch)
          echo "Updating lgtbot on branch $branch"
          cd lgtbot
          git fetch origin $branch;
          git checkout $branch;
          git pull origin $branch;

      - name: Detect changes
        id: detect
        run: |
          git add lgtbot
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --staged --stat
          fi

      - name: Commit & push
        if: steps.detect.outputs.changed == 'true'
        run: |
          new_hash=$(git -C lgtbot rev-parse --short HEAD)
          git commit -m "update lgtbot submodule to ${new_hash}"
          git push origin HEAD:main

  # 子模块有更新 → 重打预编译包
  trigger-prebuilt:
    needs: update-lgtbot
    if: needs.update-lgtbot.outputs.changed == 'true'
    uses: ./.github/workflows/prebuilt.yml
    secrets: inherit
