name: Prebuilt

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'LGTBot_ElainaBot.cc'
      - 'CMakeLists.txt'
      - 'build.sh'
      - '.gitmodules'
      - 'lgtbot'
      - '.github/workflows/prebuilt.yml'
      - 'tools/pack_prebuilt.sh'

permissions:
  contents: write

concurrency:
  group: prebuilt
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_tag: ubuntu-22.04
            runs_on: ubuntu-22.04
            container: ''
            sudo: sudo
          - os_tag: ubuntu-24.04
            runs_on: ubuntu-24.04
            container: ''
            sudo: sudo
          - os_tag: debian-12
            runs_on: ubuntu-latest
            container: debian:12
            sudo: ''
    steps:
      - name: Install git (container only)
        if: matrix.container != ''
        run: |
          apt-get update && apt-get install -y git ca-certificates
          git config --global --add safe.directory '*'

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          ${{ matrix.sudo }} apt-get update
          ${{ matrix.sudo }} apt-get remove -y libunwind-14 || true
          ${{ matrix.sudo }} apt-get install -y \
            build-essential cmake zip patch \
            libcurl4-openssl-dev \
            libboost-python-dev libboost-system-dev \
            libgoogle-glog-dev libgflags-dev libsqlite3-dev \
            qtbase5-dev libqt5webkit5-dev python3-dev python3-pybind11 \
            libprotobuf-dev protobuf-compiler

      - name: Build via build.sh
        run: |
          chmod +x build.sh
          bash build.sh -j"$(nproc)"

      - name: Package prebuilt
        run: |
          chmod +x tools/pack_prebuilt.sh
          bash tools/pack_prebuilt.sh ${{ matrix.os_tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.os_tag }}
          path: dist/*.zip
          if-no-files-found: error

  # 单独的发布 job:始终覆盖 `prebuilt` 这一个滚动预发布 tag
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - name: Trim rolling release to two batches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view prebuilt --repo "$REPO" --json assets > assets.json 2>/dev/null; then
            echo "prebuilt release not found; first publish, nothing to trim"
            exit 0
          fi
          python3 tools/trim_prebuilt_release.py assets.json dist

      - name: Publish to rolling prebuilt release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt
          prerelease: true
          name: 预编译包（滚动更新）
          body: |
            自动构建的预编译包，**滚动更新，仅保留最新的 2 个版本**。

            - 最新版由 commit `${{ github.sha }}` 触发构建
            - 每档 zip 对应一个发行版 + Python ABI（见 asset 名与包内 `manifest.json`）
            - 下载后在插件 Web 面板「📦 预编译部署」页安装、切换、重启即可，**无需本地编译工具链**

            > 本预发布仅承载预编译产物，独立于正式版 Release。
          files: dist/*.zip
          fail_on_unmatched_files: true
